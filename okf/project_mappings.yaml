# Project name normalization rules — loaded by obsidian_sync_core.normalize_project()
#
# junk_patterns:
#   Strings that indicate a junk entry (return empty string so caller can skip).
#   Checked with startswith on the lowercased, cleaned project name.
#
# rules:
#   List of {keywords, canonical} evaluated in order; first match wins.
#   ALL keywords must be present (as substrings) in the lowercased project name.
#   Order matters — more specific patterns should come first.

junk_patterns:
  - "install packages"
  - "install requirements"
  - "create environment"
  - "transform and compile models"
  - "run data quality tests"
  - "generated by:"
  - "query:"
  - "install"
  - "create "

